name: homepage

# Status dashboard: one tile per enabled stack with live up/down checks.
# Static YAML (generated into ./config by `./lab render` from each stack's
# homepage.yaml), no Docker socket, no label auto-discovery.
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.4.0
    container_name: homepage
    restart: unless-stopped
    networks: [default, proxy]
    env_file: .env
    environment:
      # Homepage validates the Host header; anything not listed gets a blank page.
      HOMEPAGE_ALLOWED_HOSTS: dash.${DOMAIN}
    volumes:
      - ./config:/app/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: wget -q -O /dev/null http://localhost:3000/ || exit 1
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  proxy:
    external: true
