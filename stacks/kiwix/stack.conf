DESCRIPTION="Kiwix: offline Wikipedia and other ZIM archives in the browser"
GROUP=Documents
HOST=wiki
PROFILES="full"
CONTAINERS="kiwix"
# Off until needed: ./lab up kiwix (prints the address), ./lab down kiwix.
ON_DEMAND=yes
DIRS="ZIM_DIR ${ROOT}/stacks/kiwix/data"
RAM_GB=0.5
DISK_GB=0.2
# Nothing to back up: ZIM files can be downloaded again and the library
# index is rebuilt at every start.
