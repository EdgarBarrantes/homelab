DESCRIPTION="Photo and video library (Google Photos replacement)"
GROUP=Photos
HOST=photos
GPU=optional
HEAVY=yes
OVERLAYS="gpu.yml:GPU"
SECRETS="DB_PASSWORD"
DIRS="PHOTOS_DIR"
PROFILES="standard full"
CONTAINERS="immich_server immich_machine_learning immich_postgres immich_redis"
RAM_GB=3
DISK_GB=10
BACKUP_PATHS='${PHOTOS_DIR}'
# Postgres: dumped nightly as <PG_DUMP>-<date>.sql.gz; restore resets the
# role's password to PG_PASSWORD_KEY from this stack's .env.
PG_CONTAINER=immich_postgres
PG_SERVICE=database
PG_USER=postgres
PG_DUMP=immich
PG_PASSWORD_KEY=DB_PASSWORD
PG_DATA=postgres
