# Added by lab when GPU=yes: CUDA build of the ML service. CDI, not
# `driver: nvidia`: a host `systemctl daemon-reload` strips the GPU from
# nvidia-driver containers.
services:
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              device_ids: [nvidia.com/gpu=all]
              capabilities: [gpu]
