name: ntfy

# Self-hosted ntfy: push notifications to the ntfy phone app, private
# (deny-all, behind Caddy). Two accounts, both generated by lab and defined
# on every start (start.sh): `phone` reads (password: ./lab secret ntfy
# NTFY_PHONE_PASSWORD), `homelab` publishes with NTFY_PUBLISH_TOKEN.
# ntfy-watch alerts when Home Assistant (HA_URL) stops answering: the one
# alert that can't come from Home Assistant itself.
services:
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: ntfy
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/start.sh"]
    networks: [default, proxy]
    environment:
      TZ: ${TZ}
      NTFY_BASE_URL: https://ntfy.${DOMAIN}
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_PHONE_PASSWORD: ${NTFY_PHONE_PASSWORD}
      NTFY_PUBLISH_TOKEN: ${NTFY_PUBLISH_TOKEN}
    volumes:
      - ./data:/var/lib/ntfy
      - ./start.sh:/start.sh:ro
    healthcheck:
      test: wget -q -O /dev/null http://localhost/v1/health || exit 1
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 5

  ntfy-watch:
    image: binwiederhier/ntfy:v2.28.0
    container_name: ntfy-watch
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/watch.sh"]
    environment:
      TZ: ${TZ}
      HA_URL: ${HA_URL:-}
      NTFY_URL: http://ntfy
      NTFY_TOPIC: homelab-alerts
      NTFY_TOKEN: ${NTFY_PUBLISH_TOKEN}
      WATCH_INTERVAL: "60"     # seconds between checks
      WATCH_DOWN_AFTER: "10"   # failed checks in a row before alerting
    volumes:
      - ./watch.sh:/watch.sh:ro
    depends_on:
      ntfy:
        condition: service_healthy

networks:
  proxy:
    external: true
