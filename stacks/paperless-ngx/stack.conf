DESCRIPTION="Scanned documents: OCR, full-text search, auto-filing"
GROUP=Documents
HOST=docs
HEAVY=yes
OVERLAYS="ai.yml:PAPERLESS_AI"
SECRETS="PAPERLESS_SECRET_KEY POSTGRES_PASSWORD PAPERLESS_ADMIN_PASSWORD"
DIRS="PAPERLESS_CONSUME_DIR"
PROFILES="standard full"
CONTAINERS="paperless_webserver paperless_db paperless_redis"
RAM_GB=1.5
DISK_GB=5
BACKUP_PATHS='${ROOT}/stacks/paperless-ngx/data/media'
PG_CONTAINER=paperless_db
PG_SERVICE=db
PG_USER=paperless
PG_DUMP=paperless
PG_PASSWORD_KEY=POSTGRES_PASSWORD
PG_DATA=data/postgres
