DESCRIPTION="Stremio: streaming server and web player"
GROUP=Library
HOST=stremio
# In no profile: torrent streaming is a choice to make (./lab enable stremio).
PROFILES=""
CONTAINERS="stremio"
# Off until needed: ./lab up stremio (prints the address), ./lab down stremio.
ON_DEMAND=yes
OVERLAYS="vpn.yml:?VPN_PROVIDER vaapi.yml:?VAAPI_DEVICE"
DIRS="${ROOT}/stacks/stremio/data"
RAM_GB=0.5
DISK_GB=3
# Nothing to back up: a cache, and the library and add-ons live in the
# Stremio account.
