DESCRIPTION="Dawarich: your own location history (a Google Timeline replacement)"
GROUP=Home
HOST=timeline
PROFILES="full"
CONTAINERS="dawarich_app dawarich_sidekiq dawarich_db dawarich_redis"
SECRETS="POSTGRES_PASSWORD DAWARICH_ADMIN_PASSWORD"
DIRS="${ROOT}/stacks/dawarich/data/storage ${ROOT}/stacks/dawarich/data/watched"
RAM_GB=1.5
DISK_GB=5
BACKUP_PATHS='${ROOT}/stacks/dawarich/data/storage'
PG_CONTAINER=dawarich_db
PG_SERVICE=db
PG_USER=postgres
PG_DUMP=dawarich
PG_PASSWORD_KEY=POSTGRES_PASSWORD
PG_DATA=data/postgres
