name: dawarich

# Location history: phone apps (Dawarich's own, OwnTracks, GPSLogger, ...)
# post points with the account's API key; Google Takeout imports upload in
# the web UI or go in data/watched. No reverse geocoding unless you set a
# provider (PHOTON_API_HOST, ...), so nothing leaves the server; the map
# tiles are fetched by your browser.
# https://dawarich.app/docs/self-hosting/environment-variables/
x-env: &env
  RAILS_ENV: production
  PUID: ${PUID}
  PGID: ${PGID}
  REDIS_URL: redis://dawarich_redis:6379
  DATABASE_HOST: dawarich_db
  DATABASE_PORT: 5432
  DATABASE_USERNAME: postgres
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
  DATABASE_NAME: dawarich
  APPLICATION_HOSTS: timeline.${DOMAIN},localhost,127.0.0.1,dawarich_app
  APPLICATION_PROTOCOL: http
  TIME_ZONE: ${TZ}
  SECRET_KEY_BASE: ${SECRET_KEY_BASE}
  SELF_HOSTED: "true"
  STORE_GEODATA: "true"
  RAILS_LOG_TO_STDOUT: "true"

x-app: &app
  image: freikin/dawarich:1.15.3
  restart: unless-stopped
  volumes:
    - ./data/storage:/var/app/storage
    - ./data/watched:/var/app/tmp/imports/watched
  logging:
    options: {max-size: 20m, max-file: "3"}

services:
  redis:
    image: redis:7.4-alpine
    container_name: dawarich_redis
    restart: unless-stopped
    command: redis-server --save 900 1 --save 300 10 --appendonly no
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: redis-cli ping | grep -q PONG
      interval: 10s
      retries: 5

  db:
    image: postgis/postgis:17-3.5-alpine
    container_name: dawarich_db
    restart: unless-stopped
    shm_size: 1g
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dawarich
    healthcheck:
      test: pg_isready -U postgres -d dawarich
      interval: 10s
      retries: 5

  app:
    <<: *app
    container_name: dawarich_app
    entrypoint: web-entrypoint.sh
    command: [bin/rails, server, -p, "3000", -b, "::"]
    networks: [default, proxy]
    environment:
      <<: *env
      WEB_CONCURRENCY: 1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO - http://127.0.0.1:3000/api/v1/health | grep -q ok"]
      interval: 10s
      retries: 30
      start_period: 60s
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 2g}

  sidekiq:
    <<: *app
    container_name: dawarich_sidekiq
    # Replace the default demo login first (first-login.rb), then the stock
    # entrypoint, which ignores arguments and runs sidekiq.
    entrypoint: [sh, -c, "bin/rails runner /setup/first-login.rb; exec sidekiq-entrypoint.sh"]
    volumes:
      - ./data/storage:/var/app/storage
      - ./data/watched:/var/app/tmp/imports/watched
      - ./first-login.rb:/setup/first-login.rb:ro
    environment:
      <<: *env
      DAWARICH_ADMIN_EMAIL: admin@${DOMAIN}
      DAWARICH_ADMIN_PASSWORD: ${DAWARICH_ADMIN_PASSWORD}
      # Raise for a big Takeout import, then put it back.
      BACKGROUND_PROCESSING_CONCURRENCY: 3
    healthcheck:
      test: pgrep -f sidekiq
      interval: 30s
      retries: 10
      start_period: 60s
    depends_on:
      app: {condition: service_healthy}

networks:
  proxy:
    external: true
