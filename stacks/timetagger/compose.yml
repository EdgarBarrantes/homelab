name: timetagger

# TimeTagger: a timeline of what you spent time on, by #tag, with daily
# and weekly targets. One account (TIMETAGGER_USER, default "me"; password:
# ./lab secret timetagger TIMETAGGER_PASSWORD). Its API (token on the
# Account page) gives totals to Home Assistant. Data: a SQLite file per
# user in ./data.
services:
  timetagger:
    build: .
    image: local/timetagger:26.1.3
    container_name: timetagger
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    entrypoint: ["/bin/sh", "/start.sh"]
    networks: [proxy]
    # For Home Assistant's REST sensor (every API call needs the token).
    # LAN_BIND=127.0.0.1 keeps it on this machine.
    ports:
      - "${LAN_BIND}:8040:80"
    environment:
      TZ: ${TZ}
      TIMETAGGER_BIND: 0.0.0.0:80
      TIMETAGGER_DATADIR: /data
      TIMETAGGER_LOG_LEVEL: info
      TIMETAGGER_USER: ${TIMETAGGER_USER:-me}
      TIMETAGGER_PASSWORD: ${TIMETAGGER_PASSWORD}
    volumes:
      - ./data:/data
      - ./start.sh:/start.sh:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/timetagger/status')"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  proxy:
    external: true
