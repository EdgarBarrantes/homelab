name: glances

# System monitor (CPU, memory, disks, network, GPU, containers).
# network_mode: host is needed for real interface stats (a bridge would only
# show its own veth), which means it can't join `proxy`: Caddy and Homepage
# reach it at host.docker.internal instead. Read-only docker socket and host
# PID namespace are Glances' documented requirements for container/process
# stats; docker.sock read access does expose all container metadata.
# Host networking also puts the API on every interface, so it needs a
# password (GLANCES_PASSWORD, generated; start.sh hands it to Glances).
services:
  glances:
    image: nicolargo/glances:ubuntu-4.5.7-full
    container_name: glances
    restart: unless-stopped
    pid: host
    network_mode: host
    command: ["/bin/sh", "/start.sh"]
    environment:
      GLANCES_OPT: "-w --password"
      GLANCES_PASSWORD: ${GLANCES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./start.sh:/start.sh:ro
    healthcheck:
      test: curl -f -s -o /dev/null -u "glances:$$GLANCES_PASSWORD" http://localhost:61208/api/4/status || exit 1
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 5
