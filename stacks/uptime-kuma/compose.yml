name: uptime-kuma

# Uptime Kuma: checks sites and servers that run somewhere else (HTTP, keyword,
# TCP, certificate expiry) and alerts through its own notification channels
# (Telegram, ntfy, email...). A server can't report its own death, so its
# checks run here. Not heavy: desktop mode leaves it running.
# Data (SQLite) in ./data. Account: UPTIME_KUMA_USER (default "admin"),
# password: ./lab secret uptime-kuma UPTIME_KUMA_PASSWORD (setup.txt).
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.12-slim-rootless
    container_name: uptime-kuma
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    networks: [proxy]
    environment:
      TZ: ${TZ}
      UPTIME_KUMA_DB_TYPE: sqlite
    volumes:
      - ./data:/app/data

networks:
  proxy:
    external: true
