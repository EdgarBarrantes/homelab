name: calibre-web

# Calibre-Web Automated: Calibre-Web plus an import folder. Books dropped
# into BOOKS_IMPORT_DIR are converted (EPUB by default), get their metadata
# fetched and are added to the library, then DELETED from that folder (the
# originals are kept in ./config/processed_books). Copy finished files in,
# don't download straight into it. Also: Kobo and KOReader sync, OPDS,
# send-to-ereader. Calibre desktop can share the library folder, just not
# while both are writing (metadata.db is SQLite).
# Known in v4.0.8: the folder watcher ignores .djvu files (the importer
# itself handles them; run it by hand:
#   ./lab compose calibre-web exec -u abc -e HOME=/config calibre-web sh -c \
#     'cd /app/calibre-web-automated/scripts && for f in /cwa-book-ingest/*.djvu;
#      do python3 ingest_processor.py "$f"; done'),
# and macOS "._*" files from a copied folder get imported as junk books:
# delete them first. Run calibredb as -u abc too: as root it leaves root-owned
# files in the library and every later import fails to chown it.
# Settings live in ./config/app.db (same format as stock Calibre-Web, so an
# old ./config carries over). First login: admin / admin123, change it.
services:
  calibre-web:
    image: crocodilestick/calibre-web-automated:v4.0.8
    container_name: calibre-web
    restart: unless-stopped
    networks: [default, proxy]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./config:/config
      - ${BOOKS_DIR}:/calibre-library
      - ${BOOKS_IMPORT_DIR:?set BOOKS_IMPORT_DIR in homelab.env}:/cwa-book-ingest
    healthcheck:
      test: curl -fs -o /dev/null http://localhost:8083/ || exit 1
      start_period: 120s # first boot sets up the library and its services
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  proxy:
    external: true
