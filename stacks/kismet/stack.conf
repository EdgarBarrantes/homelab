DESCRIPTION="Kismet: Wi-Fi survey and intrusion alerts (needs a spare USB Wi-Fi adapter)"
GROUP=Infrastructure
HOST=kismet
# In no profile: it needs a USB Wi-Fi adapter of its own (./lab enable kismet).
PROFILES=""
CONTAINERS="kismet kismet-radio"
# Off until needed: ./lab up kismet (prints the address), ./lab down kismet.
ON_DEMAND=yes
SECRETS="KISMET_PASSWORD"
DIRS="${ROOT}/stacks/kismet/data"
RAM_GB=0.5
DISK_GB=1
# Nothing to back up: survey logs, deleted after KISMET_KEEP_DAYS.
